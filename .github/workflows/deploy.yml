name: Deploy to EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'weather-backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build with Maven
        working-directory: weather-backend
        run: mvn clean package -DskipTests

      - name: Prepare SSH key
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" | sed 's/\\n/\n/g' > ~/.ssh/ec2_key
          test -s ~/.ssh/ec2_key

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ~/.ssh/ec2_key
          source: "weather-backend/target/weather-api-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/"
          strip_components: 2

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ~/.ssh/ec2_key
          script: |
            sudo systemctl restart backend
            sudo systemctl status backend --no-pager
